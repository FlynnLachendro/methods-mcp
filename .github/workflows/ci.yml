name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-scope token. CI only needs to read the repo contents; it doesn't
# write back, comment on PRs, or publish artifacts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # UV_PYTHON overrides any `.python-version` pin so every `uv run` in this job
    # uses the matrix-specified interpreter rather than re-resolving to 3.11.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra agent

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest tests -v
